<!DOCTYPE html>
<html>
<head>
  <title>GeoJSON Viewer</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    #deptSelect {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 10px;
      padding: 8px;
      background: white;
    }
  </style>
</head>

<body>

<select id="deptSelect">
  <option value="">-- Choisir un département --</option>
</select>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  var map = L.map("map").setView([46.7, 2.5], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  var currentLayer = null;
  var uaiColors = {};

  var departments = [];
  for (var d = 1; d <= 95; d++) {
    departments.push(String(d));
  }
  departments.push("2A", "2B", "971", "972", "973", "974", "976");

  var select = document.getElementById("deptSelect");

  departments.forEach(function(d) {
    var opt = document.createElement("option");
    opt.value = d;
    opt.textContent = d;
    select.appendChild(opt);
  });

  function getColor(uai) {
    uai = (uai || "").toString().trim();

    if (!uai) return "#ff0000";

    if (!uaiColors[uai]) {
      var hue = Object.keys(uaiColors).length * 137.508 % 360;
      uaiColors[uai] = "hsl(" + hue + ", 75%, 55%)";
    }

    return uaiColors[uai];
  }

  function getUAI(feature) {
    var p = feature.properties || {};
    return p.code_rne || p.UAI || p.uai || p.code_st || "";
  }

 var currentOverlapLayer = null;

 var assignedColors = {};
var usedColors = {};

function generateColor(seed) {
  var hash = 0;
  for (var i = 0; i < seed.length; i++) {
    hash = seed.charCodeAt(i) + ((hash << 5) - hash);
  }

  var hue = Math.abs(hash) % 360;
  return "hsl(" + hue + ", 70%, 55%)";
}

select.addEventListener("change", function() {
  var dept = this.value;
  if (!dept) return;

  var file = "https://raw.githubusercontent.com/memeriau/cartescolaire/main/cartescolaire_" + dept + ".geojson";

  console.log("Loading:", file);

  fetch(file)
    .then(function(res) {
      if (!res.ok) throw new Error("File not found: " + file);
      return res.json();
    })
    .then(function(data) {

      if (currentLayer) {
        map.removeLayer(currentLayer);
      }

      if (currentOverlapLayer) {
        map.removeLayer(currentOverlapLayer);
      }

      currentLayer = L.geoJSON(data, {
        style: function(feature) {
  var uai = getUAI(feature);

  if (!assignedColors[uai]) {
    assignedColors[uai] = generateColor(uai);
  }

  return {
    color: "black",
    weight: 1,
    fillColor: assignedColors[uai],
    fillOpacity: 0.25
  };
},

        onEachFeature: function(feature, layer) {
          var uai = getUAI(feature);
          layer.bindPopup("UAI: " + (uai || "missing"));
        }
      }).addTo(map);

      map.fitBounds(currentLayer.getBounds());

      // Detect overlaps inside selected department
      var overlaps = [];
      var features = data.features || [];

      for (var i = 0; i < features.length; i++) {
        for (var j = i + 1; j < features.length; j++) {
          var f1 = features[i];
          var f2 = features[j];

          try {
            var intersection = turf.intersect(f1, f2);

            if (intersection) {
              intersection.properties = {
                UAI_1: getUAI(f1),
                UAI_2: getUAI(f2)
              };

              overlaps.push(intersection);
            }
          } catch (e) {
            console.warn("Intersection failed:", i, j, e);
          }
        }
      }

      console.log("Overlaps found:", overlaps.length);

      currentOverlapLayer = L.geoJSON(overlaps, {
        style: function(feature) {
          return {
            color: "red",
            weight: 2,
            fillColor: "red",
            fillOpacity: 0.25
          };
        },

        onEachFeature: function(feature, layer) {
          layer.bindPopup(
            "Overlap between:<br>" +
            "UAI 1: " + feature.properties.UAI_1 + "<br>" +
            "UAI 2: " + feature.properties.UAI_2
          );
        }
      }).addTo(map);

    })
    .catch(function(err) {
      alert(err.message);
      console.error(err);
    });
});

});
</script>

</body>
</html>
