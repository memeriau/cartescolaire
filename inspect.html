<!DOCTYPE html>
<html>
<head>
  <title>GeoJSON Viewer</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    #searchBox {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 10px;
      width: 420px;
      background: white;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-family: Arial, sans-serif;
    }

    #addressInput {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-size: 14px;
    }

    #suggestions {
      margin-top: 6px;
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid #ddd;
      display: none;
      background: white;
    }

    .suggestion {
      padding: 8px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .suggestion:hover {
      background: #f0f0f0;
    }
  </style>
</head>

<body>

<div id="searchBox">
  <input id="addressInput" type="text" placeholder="Adresse, commune ou département..." />
  <div id="suggestions"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  var map = L.map("map").setView([46.7, 2.5], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  var input = document.getElementById("addressInput");
  var suggestionsBox = document.getElementById("suggestions");

  var currentLayer = null;
  var currentOverlapLayer = null;
  var currentMarker = null;

  var assignedColors = {};
  var collegeLookup = {};
  var debounceTimer = null;
  var suggestions = [];

  function cleanKey(x) {
    return String(x || "")
      .trim()
      .toUpperCase()
      .replace(/\s+/g, "");
  }

  function getUAI(feature) {
    var p = feature.properties || {};
    return cleanKey(p.code_rne || p.UAI || p.uai || p.code_st || "");
  }

  function generateColor(seed) {
    seed = cleanKey(seed);

    var hash = 0;
    for (var i = 0; i < seed.length; i++) {
      hash = seed.charCodeAt(i) + ((hash << 5) - hash);
    }

    var hue = Math.abs(hash) % 360;
    return "hsl(" + hue + ", 70%, 55%)";
  }

  function normalizeDepartmentQuery(query) {
    query = String(query || "").trim().toUpperCase();

    if (/^0[1-9]$/.test(query)) {
      return query.substring(1);
    }

    return query;
  }

  function isDepartmentQuery(query) {
    query = String(query || "").trim().toUpperCase();

    return (
      /^[0-9]{1,3}$/.test(query) ||
      query === "2A" ||
      query === "2B"
    );
  }

  function getDepartementFromAddressProperties(p) {
    var postcode = String(p.postcode || "").trim();
    var citycode = String(p.citycode || "").trim();

    if (citycode.indexOf("2A") === 0) return "2A";
    if (citycode.indexOf("2B") === 0) return "2B";

    if (postcode.indexOf("97") === 0 || postcode.indexOf("98") === 0) {
      return postcode.substring(0, 3);
    }

    if (postcode.length >= 2) {
      return normalizeDepartmentQuery(postcode.substring(0, 2));
    }

    return "";
  }

  function hideSuggestions() {
    suggestionsBox.innerHTML = "";
    suggestionsBox.style.display = "none";
  }

  function showSuggestions(items) {
    suggestionsBox.innerHTML = "";

    if (!items.length) {
      suggestionsBox.innerHTML = "<div class='suggestion'>Aucun résultat</div>";
      suggestionsBox.style.display = "block";
      return;
    }

    items.forEach(function(feature, index) {
      var p = feature.properties || {};
      var div = document.createElement("div");

      div.className = "suggestion";
      div.textContent = p.label || "";

      div.addEventListener("click", function() {
        selectAddress(index);
      });

      suggestionsBox.appendChild(div);
    });

    suggestionsBox.style.display = "block";
  }

  function fetchBAN(query) {
    clearTimeout(debounceTimer);

    debounceTimer = setTimeout(function() {
      query = String(query || "").trim();

      if (query.length < 2) {
        hideSuggestions();
        return;
      }

      if (isDepartmentQuery(query)) {
        var dept = normalizeDepartmentQuery(query);

        suggestions = [{
          properties: {
            label: "Charger le département " + dept,
            type: "department",
            dept: dept
          },
          geometry: null
        }];

        showSuggestions(suggestions);
        return;
      }

      fetch(
        "https://data.geopf.fr/geocodage/search/?q=" +
        encodeURIComponent(query) +
        "&limit=20&autocomplete=1"
      )
        .then(function(res) {
          return res.json();
        })
        .then(function(data) {
          suggestions = (data.features || []).filter(function(f) {
            return f.properties && (
              f.properties.type === "housenumber" ||
              f.properties.type === "street" ||
              f.properties.type === "municipality"
            );
          });

          showSuggestions(suggestions);
        })
        .catch(function(err) {
          console.error("Erreur BAN:", err);
          hideSuggestions();
        });

    }, 250);
  }

  fetch("https://raw.githubusercontent.com/memeriau/cartescolaire/main/colleges.json")
    .then(function(res){
      if (!res.ok) throw new Error("colleges.json not found");
      return res.json();
    })
    .then(function(data){
      data.forEach(function(c){
        var key = cleanKey(c.UAI || c.uai || c.code_rne || "");
        var nom = c.Nom || c.nom || c.nom_etab || "";

        if (key) {
          collegeLookup[key] = nom;
        }
      });

      console.log("College lookup loaded:", Object.keys(collegeLookup).length);
    })
    .catch(function(err){
      console.error("Error loading colleges.json:", err);
    });

  function loadDepartment(dept, addressFeature) {
    dept = normalizeDepartmentQuery(dept);

    var file = "https://raw.githubusercontent.com/memeriau/cartescolaire/main/cartescolaire_" + dept + ".geojson";

    console.log("Loading:", file);

    fetch(file)
      .then(function(res) {
        if (!res.ok) throw new Error("File not found: " + file);
        return res.json();
      })
      .then(function(data) {

        if (currentLayer) map.removeLayer(currentLayer);
        if (currentOverlapLayer) map.removeLayer(currentOverlapLayer);
        if (currentMarker) map.removeLayer(currentMarker);

        currentLayer = L.geoJSON(data, {
          style: function(feature) {
            var uai = getUAI(feature);

            if (!assignedColors[uai]) {
              assignedColors[uai] = generateColor(uai);
            }

            return {
              color: "black",
              weight: 1,
              fillColor: assignedColors[uai],
              fillOpacity: 0.25
            };
          },

          onEachFeature: function(feature, layer) {
            var uai = getUAI(feature);
            var name = collegeLookup[uai] || "Nom inconnu";

            layer.bindPopup(
              "UAI: " + (uai || "missing") + "<br>" +
              "Nom: " + name
            );
          }
        }).addTo(map);

        var hasPoint =
  addressFeature &&
  addressFeature.geometry &&
  addressFeature.geometry.coordinates &&
  addressFeature.geometry.coordinates.length >= 2;

var selectionType = addressFeature && addressFeature.properties
  ? addressFeature.properties.type
  : "";

var showCollegeForPoint = hasPoint && selectionType === "housenumber";

if (showCollegeForPoint) {
  var coords = addressFeature.geometry.coordinates;
  var lng = coords[0];
  var lat = coords[1];

  currentMarker = L.marker([lat, lng]).addTo(map);

  var point = turf.point([lng, lat]);
  var collegesAtAddress = [];

          (data.features || []).forEach(function(poly) {
            try {
              if (
                turf.booleanPointInPolygon(point, poly, { ignoreBoundary: false }) ||
                turf.booleanIntersects(point, poly)
              ) {
                var uai = getUAI(poly);
                var nom = collegeLookup[uai] || "Nom inconnu";

                collegesAtAddress.push({
                  uai: uai,
                  nom: nom
                });
              }
            } catch (e) {
              console.warn("Erreur point-in-polygon:", e);
            }
          });

          var popupHtml = "<b>Adresse sélectionnée</b><br>" +
            (addressFeature.properties.label || "") + "<br><br>";

          if (collegesAtAddress.length > 0) {
            popupHtml += "<b>Collège(s) associé(s)</b><br>";

            collegesAtAddress.forEach(function(c) {
              popupHtml +=
                "UAI: " + (c.uai || "missing") + "<br>" +
                "Nom: " + c.nom + "<br><br>";
            });
          } else {
            popupHtml += "<b>Aucun collège trouvé</b>";
          }

          currentMarker.bindPopup(popupHtml).openPopup();
        }

        var overlaps = [];
        var features = data.features || [];

        for (var i = 0; i < features.length; i++) {
          for (var j = i + 1; j < features.length; j++) {
            var f1 = features[i];
            var f2 = features[j];

            try {
              var intersection = turf.intersect(f1, f2);

              if (intersection) {
                intersection.properties = {
                  UAI_1: getUAI(f1),
                  UAI_2: getUAI(f2)
                };

                overlaps.push(intersection);
              }
            } catch (e) {
              console.warn("Intersection failed:", i, j, e);
            }
          }
        }

        console.log("Overlaps found:", overlaps.length);

        currentOverlapLayer = L.geoJSON(overlaps, {
          style: function(feature) {
            return {
              color: "red",
              weight: 2,
              fillColor: "red",
              fillOpacity: 0.1
            };
          },

          onEachFeature: function(feature, layer) {
            var u1 = feature.properties.UAI_1;
            var u2 = feature.properties.UAI_2;

            var n1 = collegeLookup[u1] || "Nom inconnu";
            var n2 = collegeLookup[u2] || "Nom inconnu";

            layer.bindPopup(
              "Overlap between:<br>" +
              "UAI 1: " + u1 + "<br>" +
              "Nom 1: " + n1 + "<br><br>" +
              "UAI 2: " + u2 + "<br>" +
              "Nom 2: " + n2
            );
          }
        }).addTo(map);

      if (currentMarker) {
  var group = L.featureGroup([currentLayer, currentMarker]);
  map.fitBounds(group.getBounds(), { padding: [40, 40] });
} else {
  map.fitBounds(currentLayer.getBounds(), { padding: [40, 40] });
}

      })
      .catch(function(err) {
        alert(err.message);
        console.error(err);
      });
  }

  function selectAddress(index) {
    var feature = suggestions[index];
    if (!feature) return;

    var p = feature.properties || {};

    if (p.type === "department") {
      input.value = p.label || "";
      hideSuggestions();
      loadDepartment(p.dept, null);
      return;
    }

    var dept = getDepartementFromAddressProperties(p);

    if (!dept) {
      alert("Impossible de déterminer le département pour cette sélection.");
      return;
    }

    input.value = p.label || "";
    hideSuggestions();

    console.log("Sélection:", p.label);
    console.log("Département:", dept);

    loadDepartment(dept, feature);
  }

  input.addEventListener("input", function() {
    fetchBAN(input.value);
  });

  document.addEventListener("click", function(e) {
    if (!suggestionsBox.contains(e.target) && e.target !== input) {
      hideSuggestions();
    }
  });

});
</script>

</body>
</html>
