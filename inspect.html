<!DOCTYPE html>
<html>
<head>
  <title>Carte Scolaire</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }

    #searchBox {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 10px;
      width: 420px;
      background: white;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-family: Arial, sans-serif;
    }

    #addressInput {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-size: 14px;
    }

    #suggestions {
      margin-top: 6px;
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid #ddd;
      display: none;
      background: white;
    }

    .suggestion {
      padding: 8px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .suggestion:hover { background: #f0f0f0; }

    #layerToggles {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      color: #333;
    }

    #layerToggles label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .legend-swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .maplibregl-popup-content {
      font-family: Arial, sans-serif;
      font-size: 13px;
      max-width: 260px;
    }

    #loading {
      position: absolute;
      z-index: 2000;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px 28px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      font-family: Arial, sans-serif;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #loading-spinner {
      width: 22px;
      height: 22px;
      border: 3px solid #ddd;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading">
  <div id="loading-spinner"></div>
  Chargement de la carte…
</div>
<div id="searchBox">
  <input id="addressInput" type="text" placeholder="Adresse, commune ou département..." />
  <div id="suggestions"></div>
  <div id="layerToggles">
    <label>
      <input type="checkbox" id="toggleOverlaps" checked />
      <span class="legend-swatch" style="background:rgba(255,0,0,0.75);"></span>
      Zones de recouvrement
    </label>
    <label>
      <input type="checkbox" id="toggleOverlapsMultisecteur" checked />
      <span class="legend-swatch" style="background:rgba(0,0,139,0.75);"></span>
      Recouvrement multi-secteur
    </label>
  </div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>

<script>
(function () {
  'use strict';

  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile.bind(protocol));

  const PMTILES      = 'pmtiles://https://mathildeemeriau.com/cartescolaire/cartescolaire.pmtiles';
  const SOURCE_LAYER = 'zones';

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors'
        },
        cs: { type: 'vector', url: PMTILES }
      },
      layers: [
        { id: 'osm', type: 'raster', source: 'osm' },

        // All zones – colour driven by pre-computed hue stored in the tile
        {
          id: 'zones-fill',
          type: 'fill',
          source: 'cs',
          'source-layer': SOURCE_LAYER,
          filter: ['!', ['has', 'uai_1']],
          paint: {
            'fill-color': ['to-color', ['get', 'color']],
            'fill-opacity': 0.12
          }
        },

        // Selected colleges (from selection.csv) – higher opacity
        {
          id: 'zones-selected',
          type: 'fill',
          source: 'cs',
          'source-layer': SOURCE_LAYER,
          filter: ['in', 'code_rne', ''],   // populated after selection.csv loads
          paint: {
            'fill-color': ['to-color', ['get', 'color']],
            'fill-opacity': 0.20
          }
        },

        // Multi-secteur zones – blue tint
        {
          id: 'zones-multisecteur',
          type: 'fill',
          source: 'cs',
          'source-layer': SOURCE_LAYER,
          filter: ['all', ['!', ['has', 'uai_1']], ['==', ['get', 'multisecteur'], 1]],
          paint: { 'fill-color': '#0000ff', 'fill-opacity': 0.12 }
        },

        // Overlapping zones – red (genuine data overlaps)
        {
          id: 'overlaps-fill',
          type: 'fill',
          source: 'cs',
          'source-layer': SOURCE_LAYER,
          filter: ['all', ['has', 'uai_1'], ['!', ['has', 'multisecteur_overlap']]],
          paint: { 'fill-color': '#ff0000', 'fill-opacity': 0.75 }
        },

        // Overlapping zones – dark blue (intentional multi-secteur overlaps)
        {
          id: 'overlaps-multisecteur-fill',
          type: 'fill',
          source: 'cs',
          'source-layer': SOURCE_LAYER,
          filter: ['all', ['has', 'uai_1'], ['has', 'multisecteur_overlap']],
          paint: { 'fill-color': '#00008b', 'fill-opacity': 0.75 }
        },
        {
          id: 'zones-outline',
          type: 'line',
          source: 'cs',
          'source-layer': SOURCE_LAYER,
          paint: { 'line-color': '#000000', 'line-width': 0.5 }
        }
      ]
    },
    center: [2.5, 46.7],
    zoom: 6
  });

  // ── Search UI ──────────────────────────────────────────────────────────────

  const input          = document.getElementById('addressInput');
  const suggestionsBox = document.getElementById('suggestions');
  let suggestions    = [];
  let debounceTimer  = null;
  let currentMarker  = null;

  function normalizeDept(q) {
    q = String(q || '').trim().toUpperCase();
    return /^0[1-9]$/.test(q) ? q.substring(1) : q;
  }

  function isDeptQuery(q) {
    q = String(q || '').trim().toUpperCase();
    return /^[0-9]{1,3}$/.test(q) || q === '2A' || q === '2B';
  }

  function getDeptFromProperties(p) {
    const postcode = String(p.postcode || '').trim();
    const citycode = String(p.citycode || '').trim();
    if (citycode.startsWith('2A')) return '2A';
    if (citycode.startsWith('2B')) return '2B';
    if (postcode.startsWith('97') || postcode.startsWith('98')) return postcode.substring(0, 3);
    if (postcode.length >= 2) return normalizeDept(postcode.substring(0, 2));
    return '';
  }

  function hideSuggestions() {
    suggestionsBox.innerHTML = '';
    suggestionsBox.style.display = 'none';
  }

  function showSuggestions(items) {
    suggestionsBox.innerHTML = '';
    if (!items.length) {
      suggestionsBox.innerHTML = "<div class='suggestion'>Aucun résultat</div>";
      suggestionsBox.style.display = 'block';
      return;
    }
    items.forEach(function (f, i) {
      const div = document.createElement('div');
      div.className = 'suggestion';
      div.textContent = (f.properties || {}).label || '';
      div.addEventListener('click', function () { selectAddress(i); });
      suggestionsBox.appendChild(div);
    });
    suggestionsBox.style.display = 'block';
  }

  function fetchBAN(query) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () {
      query = String(query || '').trim();
      if (query.length < 2) { hideSuggestions(); return; }

      if (isDeptQuery(query)) {
        const dept = normalizeDept(query);
        suggestions = [{
          properties: { label: 'Voir le département ' + dept, type: 'department', dept: dept },
          geometry: null
        }];
        showSuggestions(suggestions);
        return;
      }

      fetch('https://data.geopf.fr/geocodage/search/?q=' +
            encodeURIComponent(query) + '&limit=20&autocomplete=1')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          suggestions = (data.features || []).filter(function (f) {
            const t = (f.properties || {}).type;
            return t === 'housenumber' || t === 'street' || t === 'municipality';
          });
          showSuggestions(suggestions);
        })
        .catch(hideSuggestions);
    }, 250);
  }

  function selectAddress(index) {
    const feature = suggestions[index];
    if (!feature) return;
    const p = feature.properties || {};

    if (currentMarker) { currentMarker.remove(); currentMarker = null; }
    input.value = p.label || '';
    hideSuggestions();

    if (p.type === 'department') {
      zoomToDepartment(p.dept);
      return;
    }

    const coords = feature.geometry && feature.geometry.coordinates;
    if (!coords) return;
    const [lng, lat] = coords;

    if (p.type === 'housenumber') {
      map.flyTo({ center: [lng, lat], zoom: 14 });
      currentMarker = new maplibregl.Marker().setLngLat([lng, lat]).addTo(map);

      // Wait until tiles at the new zoom are fully rendered before querying
      map.once('idle', function () {
        const px       = map.project([lng, lat]);
        const features = map.queryRenderedFeatures(px, { layers: ['zones-fill'] });

        let html = '<b>' + (p.label || '') + '</b><br><br>';
        if (features.length > 0) {
          html += '<b>Collège(s) associé(s)</b><br>';
          const seen = new Set();
          features.forEach(function (f) {
            const uai = f.properties.code_rne || '';
            if (seen.has(uai)) return;
            seen.add(uai);
            html += 'UAI&nbsp;: ' + uai + '<br>' +
                    'Nom&nbsp;: ' + (f.properties.nom || 'Nom inconnu') + '<br><br>';
          });
        } else {
          html += '<b>Aucun collège trouvé</b>';
        }

        new maplibregl.Popup()
          .setLngLat([lng, lat])
          .setHTML(html)
          .addTo(map);
      });

    } else {
      map.flyTo({ center: [lng, lat], zoom: 11 });
    }
  }

  function zoomToDepartment(dept) {
    // geo.api.gouv.fr returns the centroid of the department
    fetch('https://geo.api.gouv.fr/departements/' +
          encodeURIComponent(dept) + '?fields=centre')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.centre && d.centre.coordinates) {
          map.flyTo({ center: d.centre.coordinates, zoom: 9 });
        }
      })
      .catch(function () {});
  }

  // ── Click popup on zones ───────────────────────────────────────────────────

  map.on('click', 'zones-fill', function (e) {
    if (!e.features || !e.features.length) return;
    if (map.queryRenderedFeatures(e.point, { layers: ['overlaps-fill', 'overlaps-multisecteur-fill'] }).length > 0) return;
    const f = e.features[0].properties;
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(
        'UAI&nbsp;: ' + (f.code_rne || '') + '<br>' +
        'Nom&nbsp;: ' + (f.nom || 'Nom inconnu') +
        (f.multisecteur ? '<br><i>Multi-secteur</i>' : '')
      )
      .addTo(map);
  });

  map.on('mouseenter', 'zones-fill',    function () { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'zones-fill',    function () { map.getCanvas().style.cursor = ''; });

  map.on('click', 'overlaps-fill', function (e) {
    if (!e.features || !e.features.length) return;
    const f = e.features[0].properties;
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(
        '<b>Zone de recouvrement</b><br><br>' +
        'UAI&nbsp;: ' + (f.uai_1 || '') + '<br>' +
        'Nom&nbsp;: ' + (f.nom_1 || 'Nom inconnu') + '<br><br>' +
        'UAI&nbsp;: ' + (f.uai_2 || '') + '<br>' +
        'Nom&nbsp;: ' + (f.nom_2 || 'Nom inconnu')
      )
      .addTo(map);
  });

  map.on('mouseenter', 'overlaps-fill', function () { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'overlaps-fill', function () { map.getCanvas().style.cursor = ''; });

  map.on('click', 'overlaps-multisecteur-fill', function (e) {
    if (!e.features || !e.features.length) return;
    const f = e.features[0].properties;
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(
        '<b>Zone de recouvrement (multi-secteur)</b><br><br>' +
        'UAI&nbsp;: ' + (f.uai_1 || '') + '<br>' +
        'Nom&nbsp;: ' + (f.nom_1 || 'Nom inconnu') + '<br><br>' +
        'UAI&nbsp;: ' + (f.uai_2 || '') + '<br>' +
        'Nom&nbsp;: ' + (f.nom_2 || 'Nom inconnu')
      )
      .addTo(map);
  });

  map.on('mouseenter', 'overlaps-multisecteur-fill', function () { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'overlaps-multisecteur-fill', function () { map.getCanvas().style.cursor = ''; });

  // ── Layer toggles ─────────────────────────────────────────────────────────

  function setOverlapVisibility(layerId, visible) {
    map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
  }

  map.on('load', function () {
    document.getElementById('toggleOverlaps').addEventListener('change', function () {
      setOverlapVisibility('overlaps-fill', this.checked);
    });
    document.getElementById('toggleOverlapsMultisecteur').addEventListener('change', function () {
      setOverlapVisibility('overlaps-multisecteur-fill', this.checked);
    });
  });

  // ── Selection CSV ──────────────────────────────────────────────────────────

  function parseSelectionCSV(text) {
    return text.trim().split(/\r?\n/).slice(1)
      .map(function (l) { return l.split(',')[0].trim().toUpperCase().replace(/\s+/g, ''); })
      .filter(function (u) { return u.length > 0; });
  }

  map.once('idle', function () {
    const el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  });

  map.on('load', function () {
    fetch('https://raw.githubusercontent.com/memeriau/cartescolaire/main/raw/selection.csv')
      .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
      .then(function (csv) {
        const uais = parseSelectionCSV(csv);
        if (uais.length > 0) {
          // Legacy filter syntax: ['in', property, v1, v2, ...]
          map.setFilter('zones-selected', ['in', 'code_rne'].concat(uais));
        }
      })
      .catch(function () {});
  });

  // ── Input events ───────────────────────────────────────────────────────────

  input.addEventListener('input', function () { fetchBAN(input.value); });
  document.addEventListener('click', function (e) {
    if (!suggestionsBox.contains(e.target) && e.target !== input) hideSuggestions();
  });

})();
</script>
</body>
</html>
